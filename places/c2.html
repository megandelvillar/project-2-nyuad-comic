<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C2 (Campus Center) | NYUAD Comic Map</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <a class="back" href="../index.html">&larr; Back to map</a>
      <h1>C2 (Campus Center)</h1>
    </header>

    <main class="strip">
      <div class="panel panel-img">
        <img src="../images/c2/c2-panel-1.jpg" alt="She is at the library, hands over her face: the assignment is going to cook her and it is due in 5 hours" />
      </div>
      <div class="panel panel-img">
        <img src="../images/c2/c2-panel-2.jpg" alt="She prays with sweat on her face and says: yeah, no, I'm cooked" />
      </div>
      <div class="panel panel-img">
        <img src="../images/c2/c2-panel-3.jpg" alt="Her laptop screen only says BLANK" />
      </div>
      <div class="panel panel-img">
        <img src="../images/c2/c2-panel-4.jpg" alt="An owl on a branch says: another student struggling? I better do my job" />
      </div>
      <div class="panel panel-img">
        <img src="../images/c2/c2-panel-5.jpg" alt="She types fast and the screen fills with writing" />
      </div>
      <div class="panel panel-img">
        <img src="../images/c2/c2-panel-6.jpg" alt="She smiles, finally done, and wonders if it ever ends" />
      </div>
    </main>
  </body>
</html>
