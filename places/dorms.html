<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dorms | NYUAD Experiences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <a class="back" href="../index.html">&larr; Back to map</a>
      <h1>Dorms</h1>
    </header>

    <main class="strip strip-rows">
      <div class="row">
      <div class="panel panel-flex" style="--ratio: 0.96">
        <img src="../images/dorms/dorms-panel-1.jpg" alt="Midterm is coming: she looks at her desk and thinks it is time to lock in" />
      </div>
      <div class="panel panel-flex" style="--ratio: 0.97">
        <img src="../images/dorms/dorms-panel-2.jpg" alt="Her octopus plushie pulls her toward bed: no locking in, more sleep" />
      </div>
      <div class="panel panel-flex" style="--ratio: 0.96">
        <img src="../images/dorms/dorms-panel-3.jpg" alt="She is surprised to find herself pulled back to her bed by the octopus" />
      </div>
      </div>

      <div class="row">
      <div class="panel panel-flex" style="--ratio: 1.28">
        <img src="../images/dorms/dorms-panel-4.jpg" alt="Under the blanket at 13:00, crying and thinking she feels so isolated" />
        <button class="phone-button" id="phone-button" aria-pressed="false" aria-label="Play the song on her phone"></button>
      </div>

      <!-- Panels 5 and 6 share one spot: click the door to open it and close it again -->
      <div class="panel panel-flex door-panel" style="--ratio: 0.98">
        <button class="door-button" id="door-button" aria-pressed="false" aria-label="Open the door">
          <img class="door-closed" src="../images/dorms/dorms-panel-5.jpg" alt="Someone knocks on the door" />
          <img class="door-open" src="../images/dorms/dorms-panel-6.jpg" alt="The door opens and two friends are there: this is why I love my friends" />
        </button>
      </div>
      </div>
    </main>

    <!-- Song for the phone in panel 4: "Dreaming of you" by Komiku (CC0) -->
    <audio id="song" src="../audio/dreaming-of-you.mp3" loop></audio>

    <script src="../js/dorms.js"></script>
  </body>
</html>
