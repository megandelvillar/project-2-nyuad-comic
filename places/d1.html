<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D1 | NYUAD Experiences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css?v=3" />
  </head>
  <body>
    <header>
      <a class="back" href="../index.html">&larr; Back to map</a>
      <h1>D1</h1>
    </header>

    <main class="strip">
      <div class="panel panel-img">
        <img src="../images/d1/d1-panel-1.jpg" alt="He thinks he did a really bad job on his quiz and feels terrible" />
      </div>
      <div class="panel panel-img">
        <img src="../images/d1/d1-panel-2.jpg" alt="He asks for an ice cream and the server asks what flavor; he says vanilla, surprise me" />
      </div>

      <!-- Panels 3 and 4 share one spot: click the ice cream to add sprinkles, click again to remove them -->
      <div class="panel panel-img ice-panel">
        <button class="ice-button" id="ice-button" aria-pressed="false" aria-label="Add sprinkles to the ice cream">
          <img class="ice-plain" src="../images/d1/d1-panel-3.jpg" alt="A scoop of vanilla ice cream" />
          <img class="ice-sprinkles" src="../images/d1/d1-panel-4.jpg" alt="The ice cream now has colorful sprinkles" />
        </button>
      </div>

      <div class="panel panel-img">
        <img src="../images/d1/d1-panel-5.jpg" alt="He smiles and says he feels much better having the ice cream now" />
      </div>
    </main>

    <script src="../js/d1.js"></script>
  </body>
</html>
